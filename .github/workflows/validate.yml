name: Validate FileSift

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skill project
        run: python verified-research-writing/scripts/validate_project.py
      - name: Run reference parser tests
        run: python -m unittest discover -s verified-research-writing/tests -v
